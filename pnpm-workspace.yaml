packages:
  - 'apps/*'
  - 'packages/*'
# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@15.5.27 || 16.4.4'
  - '@next/eslint-plugin-next@15.5.27 || 16.4.4'
  - '@next/swc-darwin-arm64@15.5.27 || 16.4.4'
  - '@next/swc-darwin-x64@15.5.27 || 16.4.4'
  - '@next/swc-linux-arm64-gnu@15.5.27 || 16.4.4'
  - '@next/swc-linux-arm64-musl@15.5.27 || 16.4.4'
  - '@next/swc-linux-x64-gnu@15.5.27 || 16.4.4'
  - '@next/swc-linux-x64-musl@15.5.27 || 16.4.4'
  - '@next/swc-win32-arm64-msvc@15.5.27 || 16.4.4'
  - '@next/swc-win32-x64-msvc@15.5.27 || 16.4.4'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - next@15.5.27 || 16.4.4
  - turbo@2.11.6
